name: Deploy API to Server

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy:
    name: Deploy (${{ github.event.inputs.environment }}) API
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment }}
      BRANCH_NAME: ${{ github.ref_name }}
      SERVER_DEPLOYMENT_PATH: ${{ secrets.SERVER_DEPLOYMENT_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.5
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
          SERVER_DEPLOYMENT_PATH: ${{ env.SERVER_DEPLOYMENT_PATH }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: ENVIRONMENT,BRANCH_NAME,SERVER_DEPLOYMENT_PATH
          script: |
            set -Eeuo pipefail

            BASE_DIR="${SERVER_DEPLOYMENT_PATH%/}"
            WORK_DIR="$BASE_DIR/$ENVIRONMENT"

            echo "Environment: $ENVIRONMENT"
            echo "Branch: $BRANCH_NAME"
            echo "Base dir: $BASE_DIR"
            echo "Work dir: $WORK_DIR"

            cd "$WORK_DIR"

            export PYENV_ROOT="$HOME/.pyenv"
            export PATH="$PYENV_ROOT/bin:$PATH"

            if command -v pyenv >/dev/null 2>&1; then
              eval "$(pyenv init -)"
            else
              echo "pyenv not found in PATH"
              exit 1
            fi

            echo "pyenv version: $(pyenv version)"
            echo "python version: $(python --version)"

            echo "Fetching latest code..."
            git fetch --prune origin

            echo "Checking out branch..."
            git checkout -B "$BRANCH_NAME" "origin/$BRANCH_NAME"

            echo "Resetting working tree..."
            git reset --hard "origin/$BRANCH_NAME"

            echo "Cleaning untracked files..."
            git clean -fd -e .env -e .venv

            if [ ! -d ".venv" ]; then
              echo "Creating virtual environment..."
              python -m venv .venv
            fi

            echo "Activating virtual environment..."
            source .venv/bin/activate

            echo "Restarting service..."
            # sudo systemctl restart "$SERVICE_NAME"
            sudo systemctl restart "${ENVIRONMENT}.api.palzoltan.net.service"

            echo "Deployment finished successfully."
