name: Deploy API to Server

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment to deploy"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.1.0
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          BRANCH_NAME: ${{ github.ref_name }}
          REPO_URL: https://github.com/zoltanpal/api.palzoltan.net.git
          DEV_PATH: ${{ secrets.DEV_SERVER_DEPLOYMENT_PATH }}
          PROD_PATH: ${{ secrets.PROD_SERVER_DEPLOYMENT_PATH }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: ENVIRONMENT,BRANCH_NAME,REPO_URL,DEV_PATH,PROD_PATH
          script_stop: true
          script: |
            set -Eeuo pipefail

            if [ "$ENVIRONMENT" = "prod" ]; then
              echo "Deploying to production..."
              WORK_DIR="$PROD_PATH"
              SERVICE_NAME="api.palzoltan.net.service"
            else
              echo "Deploying to development..."
              WORK_DIR="$DEV_PATH"
              SERVICE_NAME="devapi.palzoltan.net.service"
            fi

            echo "Work dir: $WORK_DIR"
            echo "Branch: $BRANCH_NAME"
            echo "Service: $SERVICE_NAME"

            mkdir -p "$WORK_DIR"
            cd "$WORK_DIR"

            git config --global --add safe.directory "$WORK_DIR"

            if [ ! -d ".git" ]; then
              echo "Git repo not found, cloning..."
              git clone "$REPO_URL" .
            fi

            echo "Fetching latest code..."
            git fetch --prune origin

            if git show-ref --verify --quiet "refs/heads/$BRANCH_NAME"; then
              git checkout "$BRANCH_NAME"
            else
              git checkout -B "$BRANCH_NAME" "origin/$BRANCH_NAME"
            fi

            echo "Resetting working tree..."
            git reset --hard "origin/$BRANCH_NAME"

            # Keep deployment-specific files/folders
            git clean -fd \
              -e .env \
              -e .venv

            if [ ! -d ".venv" ]; then
              echo ".venv not found, creating with uv..."
              uv venv
            fi

            echo "Syncing dependencies with uv..."
            uv sync --frozen

            # Optional: run migrations or other deployment tasks here
            # .venv/bin/alembic upgrade head

            echo "Restarting service..."
            sudo systemctl restart "$SERVICE_NAME"

            echo "Checking service status..."
            if ! sudo systemctl is-active --quiet "$SERVICE_NAME"; then
              echo "Service failed to start: $SERVICE_NAME"
              echo "----- systemctl status -----"
              sudo systemctl status "$SERVICE_NAME" --no-pager -l || true
              echo "----- journalctl -----"
              sudo journalctl -u "$SERVICE_NAME" -n 100 --no-pager || true
              exit 1
            fi

            echo "Service is active."
            echo "Deployment finished successfully."